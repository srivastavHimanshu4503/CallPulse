name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Configure environment variables
        run: |
          cp .env.example .env
          cp .env.example apps/api/.env

      - run: pnpm install --frozen-lockfile

      # website build separately: skips its Puppeteer prerender step
      # (build:no-prerender) so PR checks stay fast and don't burn Actions minutes.
      - run: pnpm --filter "!@antigravity/website" -r build

      - run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:localpass@localhost:5432/indiai
          JWT_SECRET: local-dev-jwt-secret-min-32-characters
          JWT_REFRESH_SECRET: local-dev-refresh-secret-min-32-characters
          CALENDAR_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          TYPESENSE_HOST: localhost
          TYPESENSE_PORT: 8108
          TYPESENSE_PROTOCOL: http
          TYPESENSE_API_KEY: local-dev-key

      - run: pnpm --filter @antigravity/website run build:no-prerender
