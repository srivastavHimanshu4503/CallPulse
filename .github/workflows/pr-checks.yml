name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # website build separately: skips its Puppeteer prerender step
      # (build:no-prerender) so PR checks stay fast and don't burn Actions minutes.
      - run: pnpm --filter "!@antigravity/website" -r build

      - run: pnpm test

      - run: pnpm --filter @antigravity/website run build:no-prerender
