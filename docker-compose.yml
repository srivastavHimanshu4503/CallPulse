services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
      - typesense
    restart: unless-stopped

  post-call-server:
    build:
      context: .
      dockerfile: apps/post-call-server/Dockerfile
    env_file:
      - .env
    environment:
      # The shared .env sets PORT=3000 (for the api), which silently moved
      # this server off :3002 — voice-server's ingest dispatch then failed,
      # taking down extraction, recordings, and credit billing with it.
      PORT: "3002"
    depends_on:
      - postgres
    restart: unless-stopped

  voice-server:
    build:
      context: .
      dockerfile: apps/voice-server/Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
      - post-call-server
    restart: unless-stopped

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: indiai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  typesense:
    image: typesense/typesense:27.0
    ports:
      - "8108:8108"
    volumes:
      - tsdata:/data
    command: --data-dir /data --api-key=${TYPESENSE_API_KEY:-local-dev-key}
    restart: unless-stopped

volumes:
  pgdata:
  tsdata:
