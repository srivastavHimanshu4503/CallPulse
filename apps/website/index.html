    <!-- FAQPage JSON-LD — powers Google's expandable FAQ accordion in the
         SERP result. Keep in sync with FAQS array in
         apps/website/src/components/sections/FAQ.tsx (never diverge, or
         Google can flag as spam). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Does it really speak Hindi?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Hindi, Hinglish, English, Marathi, Tamil and Telugu. The voices are natural and conversational, and your agent replies in the language the caller uses."
          }
        },
        {
          "@type": "Question",
          "name": "What happens when it can't answer something?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It doesn't guess. Depending on your setup, it either warm-transfers the call to your phone or politely takes a message with the caller's details, which lands in your CRM."
          }
        },
        {
          "@type": "Question",
          "name": "Do callers know they're talking to an AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You decide. You control the greeting and how your agent introduces itself. Either way, the voice is natural enough that callers just get helped without any awkwardness."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need any new hardware or SIM?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. DeskBuddy runs entirely in the cloud on a phone number connected to your account. Your existing phones stay exactly as they are."
          }
        },
        {
          "@type": "Question",
          "name": "Can I hear what my agent said on calls?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every call comes with a recording and a full transcript in your dashboard, so you can review conversations and refine your agent's answers."
          }
        },
        {
          "@type": "Question",
          "name": "How long does setup take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Under 10 minutes. Your agent's knowledge base is generated automatically at signup, and most owners make a browser test call within their first five minutes."
          }
        },
        {
          "@type": "Question",
          "name": "Can I cancel anytime?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. There is no lock-in and no cancellation fee. The free plan stays free forever."
          }
        },
        {
          "@type": "Question",
          "name": "Is my customer data safe?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every call, transcript and contact stays inside your account. We never resell data, and you can export or delete anything from your dashboard."
          }
        }
      ]
    }
    </script>
