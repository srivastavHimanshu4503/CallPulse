packages:
  - "apps/*"
  - "packages/*"
  - "infrastructure"

allowBuilds:
  '@google/genai': true
  '@livekit/local-inference': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  puppeteer: true
  sharp: true

onlyBuiltDependencies:
  - "@google/genai"
  - "@livekit/local-inference"
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "onnxruntime-node"
  - "prisma"
  - "protobufjs"
  - "puppeteer"
  - "sharp"
